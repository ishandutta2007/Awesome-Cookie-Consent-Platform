<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF8C00;#FF0080;#FF8C00" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#FF0080;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF0080;#FF8C00;#FF0080" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="white">
    Awesome Cookie Consent Platform
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
